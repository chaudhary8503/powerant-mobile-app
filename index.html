<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Daily Rate</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ================= SCREEN 1 : CALCULATOR ================= -->
  <section class="screen is-active" id="screen-calc">
    <header class="bar">
      <span class="bar-spacer"></span>
      <h1 class="bar-title">Daily Rate</h1>
      <button class="bar-btn bar-btn-right" id="btn-to-login" aria-label="Admin login">Admin</button>
    </header>

    <main class="pad">
      <p class="lede">Enter your requirement</p>

      <label class="field">
        <span class="field-label">Wires</span>
        <input type="number" id="in-wires" inputmode="decimal" placeholder="0" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Thousands</span>
        <input type="number" id="in-thousands" inputmode="decimal" placeholder="0" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">MM</span>
        <input type="number" id="in-mm" inputmode="decimal" placeholder="0" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Core</span>
        <input type="number" id="in-core" inputmode="decimal" placeholder="0" autocomplete="off">
      </label>

      <p class="msg msg-error" id="calc-error" hidden></p>
    </main>

    <footer class="dock">
      <button class="btn btn-go" id="btn-ok">OK</button>
    </footer>
  </section>

  <!-- ================= SCREEN 2 : RESULT ================= -->
  <section class="screen" id="screen-result">
    <header class="bar">
      <button class="bar-btn bar-btn-left" id="btn-back-calc" aria-label="Back">← Back</button>
      <h1 class="bar-title">Your Rate</h1>
      <span class="bar-spacer"></span>
    </header>

    <main class="pad result-pad">
      <p class="result-caption">Today's rate</p>
      <p class="result-figure"><span class="result-cur">Rs</span><span id="result-value">0</span></p>
      <div class="result-recap" id="result-recap"></div>
    </main>

    <footer class="dock">
      <button class="btn btn-quiet" id="btn-again">Calculate again</button>
    </footer>
  </section>

  <!-- ================= SCREEN 3 : ADMIN LOGIN ================= -->
  <section class="screen" id="screen-login">
    <header class="bar">
      <button class="bar-btn bar-btn-left" id="btn-back-from-login" aria-label="Back">← Back</button>
      <h1 class="bar-title">Admin</h1>
      <span class="bar-spacer"></span>
    </header>

    <main class="pad">
      <p class="lede">Sign in to update today's parameters.</p>

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="in-email" inputmode="email" autocomplete="username" placeholder="admin@example.com">
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="in-password" autocomplete="current-password" placeholder="••••••••">
      </label>

      <p class="msg msg-error" id="login-error" hidden></p>
    </main>

    <footer class="dock">
      <button class="btn btn-go" id="btn-login">Sign in</button>
    </footer>
  </section>

  <!-- ================= SCREEN 4 : ADMIN PANEL ================= -->
  <section class="screen" id="screen-admin">
    <header class="bar bar-admin">
      <button class="bar-btn bar-btn-left" id="btn-signout">Sign out</button>
      <h1 class="bar-title">Parameters</h1>
      <span class="bar-spacer"></span>
    </header>

    <main class="pad">
      <p class="datestamp" id="admin-date">—</p>

      <div class="grid2">
        <label class="field">
          <span class="field-label">a</span>
          <input type="number" id="in-a" inputmode="decimal" step="any" placeholder="0">
        </label>
        <label class="field">
          <span class="field-label">b</span>
          <input type="number" id="in-b" inputmode="decimal" step="any" placeholder="0">
        </label>
        <label class="field">
          <span class="field-label">c</span>
          <input type="number" id="in-c" inputmode="decimal" step="any" placeholder="0">
        </label>
        <label class="field">
          <span class="field-label">d</span>
          <input type="number" id="in-d" inputmode="decimal" step="any" placeholder="0">
        </label>
      </div>

      <p class="hint" id="admin-lastsaved">—</p>
      <p class="msg msg-ok" id="admin-ok" hidden></p>
      <p class="msg msg-error" id="admin-error" hidden></p>
    </main>

    <footer class="dock">
      <button class="btn btn-go" id="btn-confirm">Confirm</button>
    </footer>
  </section>

  <!-- ================= LOADING VEIL ================= -->
  <div id="veil"><span class="veil-dot"></span></div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
